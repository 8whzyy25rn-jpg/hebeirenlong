<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Elliptical dished head — dimensioned section">
  <rect width="800" height="600" fill="#eef1ef"/>

  <!-- title block -->
  <text x="48" y="62" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="30" letter-spacing="1" fill="#171a1c">ELLIPTICAL HEAD</text>
  <text x="48" y="88" font-family="Barlow, Segoe UI, sans-serif" font-size="15" fill="#5c666c">Dished head, 2:1 — to ASME / GB tables or to drawing</text>
  <line x1="48" y1="104" x2="752" y2="104" stroke="#d2d7d4" stroke-width="1"/>

  <!-- head body -->
  <path d="M170 350 A230 116 0 0 1 630 350 L630 424 L170 424 Z" fill="#e2e7e4" stroke="#171a1c" stroke-width="3"/>
  <path d="M182 350 A218 104 0 0 1 618 350" fill="none" stroke="#171a1c" stroke-width="1.6"/>
  <line x1="170" y1="424" x2="630" y2="424" stroke="#171a1c" stroke-width="3"/>

  <!-- crown marking -->
  <line x1="400" y1="212" x2="400" y2="470" stroke="#5c666c" stroke-width="1" stroke-dasharray="16 6 4 6"/>

  <!-- inside radius callout -->
  <path d="M400 350 L400 236" stroke="#a33a1f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="410" y="266" font-family="Barlow, Segoe UI, sans-serif" font-size="15" fill="#a33a1f">h</text>

  <!-- diameter dimension -->
  <line x1="170" y1="470" x2="630" y2="470" stroke="#a33a1f" stroke-width="1.2"/>
  <path d="M170 470 l16 -6 l0 12 z M630 470 l-16 -6 l0 12 z" fill="#a33a1f"/>
  <line x1="170" y1="424" x2="170" y2="482" stroke="#a33a1f" stroke-width="1"/>
  <line x1="630" y1="424" x2="630" y2="482" stroke="#a33a1f" stroke-width="1"/>
  <text x="400" y="462" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="20" fill="#a33a1f">D</text>
  <text x="400" y="500" text-anchor="middle" font-family="Barlow, Segoe UI, sans-serif" font-size="14" fill="#5c666c">to drawing or to ASME / GB tables</text>

  <!-- straight flange note -->
  <line x1="660" y1="350" x2="700" y2="350" stroke="#5c666c" stroke-width="1"/>
  <text x="706" y="355" font-family="Barlow, Segoe UI, sans-serif" font-size="15" fill="#5c666c">SF</text>
  <line x1="660" y1="424" x2="700" y2="424" stroke="#5c666c" stroke-width="1"/>
  <line x1="700" y1="350" x2="700" y2="424" stroke="#5c666c" stroke-width="1"/>

  <!-- forms -->
  <text x="48" y="548" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="19" letter-spacing="0.5" fill="#171a1c">FORMS</text>
  <text x="120" y="548" font-family="Barlow, Segoe UI, sans-serif" font-size="15" fill="#5c666c">elliptical &#183; torispherical &#183; hemispherical &#183; pipe caps</text>
  <text x="48" y="576" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="19" letter-spacing="0.5" fill="#171a1c">EDGE</text>
  <text x="120" y="576" font-family="Barlow, Segoe UI, sans-serif" font-size="15" fill="#5c666c">as ordered &#183; bevelled for welding</text>
</svg>
